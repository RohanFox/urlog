<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>urlog</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="/theme.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="urlog is loading">
        <svg class="brand-loader brand-loader-glow" viewBox="-4 -6 132 112" height="64" width="75" aria-hidden="true">
          <polygon class="brand-loader-echo" points="52,0 78,0 28,50 78,100 52,100 2,50" />
          <polygon class="brand-loader-line" pathLength="1" points="28,50 78,0 52,0 2,50 52,100 78,100" />
          <polygon class="brand-loader-line brand-loader-line-2" pathLength="1" points="74,50 124,0 98,0 48,50 98,100 124,100" />
          <polygon class="brand-loader-solid" points="52,0 78,0 28,50 78,100 52,100 2,50" />
          <polygon class="brand-loader-solid brand-loader-solid-2" points="98,0 124,0 74,50 124,100 98,100 48,50" />
          <polygon class="brand-loader-ring" points="92.6,50 105.6,37 118.6,50 105.6,63" />
          <polygon class="brand-loader-dot" points="92.6,50 105.6,37 118.6,50 105.6,63" />
        </svg>
        <span class="boot-word" aria-hidden="true">LOADING</span>
      </div>
    </div>
  </body>
</html>
